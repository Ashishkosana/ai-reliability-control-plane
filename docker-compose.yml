services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: aicp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d aicp"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - aicp_pg:/var/lib/postgresql/data

volumes:
  aicp_pg:
